<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resume</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f7f9;
      color: #111827;
    }
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 20px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }
    p {
      margin: 0 0 20px;
      color: #4b5563;
    }
    .actions {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    a {
      display: inline-block;
      padding: 10px 14px;
      border-radius: 8px;
      background: #14532d;
      color: white;
      text-decoration: none;
      font-weight: 600;
    }
    iframe {
      width: 100%;
      height: 80vh;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: white;
    }
  </style>
</head>
<body>
  <main>
    <h1>Строганов Олег — ML Engineer</h1>
    <p>LLM / RAG / AI Agents / NLP / production ML</p>

    <div class="actions">
      <a href="resume.pdf" target="_blank">Открыть PDF</a>
      <a href="resume.pdf" download>Скачать PDF</a>
    </div>

    <iframe src="resume.pdf"></iframe>
  </main>
</body>
</html>
